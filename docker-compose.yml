services:
  postgres:
    image: postgres:16
    container_name: wtc-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: wtc-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5050:80"

volumes:
  postgres_data: